name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1

      - uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: uv sync --python 3.15

      - name: Run tests
        run: xvfb-run -a uv run pytest
