name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install virtual display and software OpenGL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1

      - uses: astral-sh/setup-uv@v6

      - name: Install Python and dependencies
        run: uv sync --python 3.15

      - name: Install software OpenGL (Windows)
        # Runners have no GPU and only OpenGL 1.1. Mesa's software renderer
        # next to python.exe provides OpenGL 3.3 for the rendering tests.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --dir mesa
          7z x (Get-ChildItem mesa/*.7z).FullName -omesa -y | Out-Null
          $dirs = uv run python -c "import os, sys; print(os.path.dirname(sys.executable)); print(os.path.dirname(sys._base_executable))"
          foreach ($dir in $dirs) { Copy-Item mesa/x64/*.dll $dir -Force }
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV

      - name: Build
        run: uv build

      - name: Type check (Linux)
        if: runner.os == 'Linux'
        run: uv run pyright

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -rs

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -rs

      - name: Start the game with the launcher (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./play.sh --frames 60 --hidden

      - name: Start the game with the launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: play.bat --frames 60 --hidden

      - name: Run a dedicated server with the launcher (Linux)
        if: runner.os == 'Linux'
        run: ./play.sh server --port 0 --no-lan --ticks 120

      - name: Run a dedicated server with the launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: play.bat server --port 0 --no-lan --ticks 120

      - name: Open the map viewer for editing with the launcher (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./play.sh view --edit --map map1 --frames 30 --hidden

      - name: Open the map viewer for editing with the launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: play.bat view --edit --map map1 --frames 30 --hidden

      - name: Uninstall a copy of the game (Linux)
        if: runner.os == 'Linux'
        run: |
          game="$RUNNER_TEMP/game"
          fake="$RUNNER_TEMP/home"
          mkdir -p "$game/data" "$fake/.config/sch5n" "$fake/.local/share/sch5n/worlds" "$fake/.local/state/sch5n/log"
          cp uninstall.sh play.sh "$game/"
          cp data/game.json "$game/data/"
          touch "$fake/.config/sch5n/settings.json" "$fake/.local/share/sch5n/worlds/a.world.json" "$fake/.local/state/sch5n/log/sch5n.log.jsonl"
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_STATE_HOME HOME="$fake" "$game/uninstall.sh" --yes
          test ! -e "$game"
          test ! -e "$fake/.config/sch5n"
          test ! -e "$fake/.local/share/sch5n"
          test ! -e "$fake/.local/state/sch5n"

      - name: Uninstall a copy of the game (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $game = Join-Path $env:RUNNER_TEMP "game"
          $local = Join-Path $env:RUNNER_TEMP "local"
          $user = Join-Path $local "Schunche\sch5n"
          New-Item -ItemType Directory -Force "$game\data", "$user\worlds", "$user\Logs" | Out-Null
          Copy-Item uninstall.bat, play.bat $game
          Copy-Item data\game.json "$game\data"
          Set-Content "$user\settings.json" "{}"
          Set-Content "$user\worlds\a.world.json" "{}"
          Set-Content "$user\Logs\sch5n.log.jsonl" ""
          $env:LOCALAPPDATA = $local
          cmd /c "`"$game\uninstall.bat`" --yes"
          if (Test-Path $game) { throw "The game folder is still there" }
          if (Test-Path (Join-Path $local "Schunche")) { throw "User files are still there" }
