[build-system]

requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]

name = "sch5n"
version = "0.0.1"
requires-python = ">=3.15"
authors = [{name = "Schunche", email = "schunche.w@gmail.com"}]
maintainers = [{name = "Schunche", email = "schunche.w@gmail.com"}]
description = "Experimental software. Use at your own risk."
readme = "README.md"
license = { file = "LICENCE" }

dependencies = [
    "fastapi",
    "glfw",
    "moderngl",
    "numba",
    "numpy",
    "pillow",
    "platformdirs",
    "psutil",
    "pygame-ce",
    "pydantic",
    "python-dotenv",
    "python-steam-api",
    "PyOpenAl",
    "sounddevice",
    "steamworkspy",
    "zeroconf",
    "jmespath",
    "moderngl-window>=3.1.1",
]

[dependency-groups]

dev = [
    "mypy",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff>=0.15.22",
    "uv",
]

[project.scripts]

sch5n = "sch5n.__main__:main"

[tool]

[tool.mypy]
mypy_path = "typings"
python_version = "3.15"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unreachable = true
strict = true
pretty = true

[tool.pytest]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = ["venv", "build", "__pycache__"]
addopts = "-q"

[tool.ruff]
indent-width = 4
line-length = 79
preview = true
target-version = "py315"
extend-exclude = ["pyproject.toml"]
respect-gitignore = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
nested-string-quote-style = "preferred"
docstring-code-format = true

[tool.ruff.lint]
future-annotations = true
preview = true
select = ["ALL"]
ignore = [
    "D203",  # Collides with D211
    "D213",  # Collides with D212
    "ERA001",  # Might remove comments (#4845)
    "COM812",  # Allow missing trailing comma
    "TD002",  # TODO does not need author
    "TD003",  # TODOs dont always need to show issue link
]

[tool.uv]
preview-features = ["format-command"]

[tool.ty]

[tool.ty.rules]
deprecated = "ignore"

[tool.ty.project-manager]
script = "uv"

[tool.ruff.lint.per-file-ignores]
# pytest is built on plain `assert` statements.
"tests/**" = ["S101"]
